<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Movimentações Diárias - Geraldo Davi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="login-screen" class="login-screen hidden">
  <div class="login-box">
    <div class="disp login-title">Movimentações Diárias</div>
    <div class="login-sub">Geraldo Davi</div>
    <input id="login-password" type="password" placeholder="Senha de acesso" />
    <button id="login-btn">Entrar</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <div class="brand"><span class="brand-icon">🧾</span><span class="brand-text">Movimentações Diárias - Geraldo Davi</span></div>
    <div class="disp saldo-label">Saldo do período</div>
    <div id="saldo" class="amt saldo-value">R$ 0,00</div>

    <div class="totals">
      <div class="total-card total-in">
        <div class="total-label">Recebido</div>
        <div id="total-recebido" class="amt total-value">R$ 0,00</div>
      </div>
      <div class="total-card total-out">
        <div class="total-label">Enviado</div>
        <div id="total-enviado" class="amt total-value">R$ 0,00</div>
      </div>
    </div>

    <div class="filters" id="filters">
      <button class="filter-chip active" data-filter="todos">Todos</button>
      <button class="filter-chip" data-filter="pessoal">Pessoal</button>
      <button class="filter-chip" data-filter="empresarial">Empresarial</button>
    </div>

    <div id="list"></div>
  </div>

  <div class="fab-row" id="fab-row">
    <button id="btn-upload" class="fab fab-primary">📷 Anexar print</button>
    <button id="btn-manual" class="fab fab-secondary">✎ Digitar</button>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-header">
        <div class="disp panel-title" id="panel-title">Nova movimentação</div>
        <button id="panel-close" class="icon-btn">✕</button>
      </div>

      <div id="upload-zone">
        <input type="file" id="file-input" accept="image/*" style="display:none" />
        <label for="file-input" id="upload-label" class="upload-label">
          <span id="upload-icon">📷</span>
          <span id="upload-text">Toque para escolher o print do comprovante</span>
        </label>
      </div>

      <div id="draft-form" class="draft-form hidden">
        <div id="extract-error" class="extract-error hidden"></div>

        <div class="toggle-row" id="type-row">
          <button class="toggle-btn" data-type="recebido">Recebido</button>
          <button class="toggle-btn" data-type="enviado">Enviado</button>
        </div>

        <div class="toggle-row" id="category-row">
          <button class="toggle-btn cat-btn" data-category="pessoal">👤 Pessoal</button>
          <button class="toggle-btn cat-btn" data-category="empresarial">💼 Empresarial</button>
        </div>

        <label class="field-label">Valor (R$)
          <input type="number" step="0.01" min="0" id="field-amount" placeholder="0,00" />
        </label>
        <label class="field-label">Descrição
          <input type="text" id="field-description" placeholder="Ex: aluguel, João, fornecedor..." />
        </label>
        <label class="field-label">Data
          <input type="date" id="field-date" />
        </label>

        <button id="btn-save" class="save-btn" disabled>Salvar movimentação</button>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
